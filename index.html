<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      #overlay {
        position: absolute; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.6); color: white; font-family: sans-serif;
        cursor: pointer; text-align: center; padding: 20px;
      }
    </style>
  </head>
  <body>
    <div id="overlay">画面をタップして<br>ベルちゃんを呼ぶ</div>

    <script>
      window.onload = () => {
        const overlay = document.querySelector('#overlay');
        const video = document.querySelector('#catVideo');
        const targetEntity = document.querySelector('#targetEntity');

        document.body.addEventListener('click', () => {
          overlay.style.display = 'none';
          video.muted = false;
          video.play();
        });

        // ターゲットを見つけた時に「消えない設定」にする
        targetEntity.addEventListener("targetFound", event => {
          console.log("発見しました！");
        });
      };
    </script>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; stayVisible: true;" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="catVideo" src="./TaskL.mp4" preload="auto" loop="true" crossorigin="anonymous" webkit-playsinline playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
        <a-video src="#catVideo" position="0 0 0" width="1" height="0.75"></a-video>
      </a-entity>
    </a-scene>
  </body>
</html>
