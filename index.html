<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
  </head>
  <body>
    <script>
      // 画面をタップした瞬間に音を解禁するで！
      document.body.addEventListener('click', () => {
        const video = document.querySelector('#catVideo');
        video.muted = false; // 消音を解除！
        video.play();
      });
    </script>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="catVideo" src="./TaskL.mp4" preload="auto" loop="true" crossorigin="anonymous" webkit-playsinline playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#catVideo" position="0 0 0" height="1" width="1" material="shader: chromakey; color: 0.1 0.9 0.2"></a-video>
      </a-entity>
    </a-scene>
  </body>
</html>
