<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
    
    <style>
      #overlay {
        position: absolute; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.8); color: white; font-family: sans-serif;
        cursor: pointer; text-align: center; font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="overlay">【ここをタップ！】<br>ベルちゃんを召喚するZ！</div>

    <script>
      window.onload = () => {
        const overlay = document.querySelector('#overlay');
        const video = document.querySelector('#catVideo');
        const stickyVideo = document.querySelector('#stickyVideo'); // ← 追加！動画の板を取得

        overlay.addEventListener('click', () => {
          overlay.style.display = 'none';
          
          video.muted = true;
          // 動画の再生をスタート！
          video.play().then(() => {
            // 【iPhone最強対策】再生が確実に始まってから、後出しでクロマキーの魔法をかける！
            stickyVideo.setAttribute('material', 'shader: chromakey; src: #catVideo; color: 0 1 0; opacity: 0.99');
            
            // そのあとで音を出す
            setTimeout(() => { video.muted = false; }, 100);
            console.log("iPhoneで再生＆透明化の魔法成功！");
          }).catch(err => {
            console.log("再生エラー:", err);
          });
        });
      };
    </script>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="catVideo" 
               src="./prototype.mp4" 
               preload="auto" 
               loop="true" 
               crossorigin="anonymous" 
               webkit-playsinline 
               playsinline 
               muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-entity id="stickyVideo" 
                 geometry="primitive: plane; width: 2.0; height: 3.56;" 
                 position="0 0 -2.5" 
                 visible="true">
        </a-entity>
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>
  </body>
</html>
