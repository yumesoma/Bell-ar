<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div style="position: absolute; z-index: 1000; top: 20px; left: 20px;">
      <button id="playButton" style="padding: 20px;">動画を再生する</button>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.querySelector('#playButton');
        const video = document.querySelector('#catVideo');
        btn.addEventListener('click', () => {
          video.play();
          btn.style.display = 'none'; // ボタンを消す
        });
      });
    </script>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false">
      <a-assets>
        <video id="catVideo" src="./prototype.mp4" loop="true" crossorigin="anonymous" playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#catVideo" width="1" height="1.78" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>
  </body>
</html>
