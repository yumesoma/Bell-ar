<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
    
    <style>
      #ui {
        position: absolute; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.8); color: white; font-family: sans-serif;
        cursor: pointer; text-align: center; font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="ui">【画面をタップ！】<br>音楽が流れるZ！</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="vid" src="./prototype.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-entity id="bellEntity"
                 geometry="primitive: plane; width: 1.0; height: 0.5625;" 
                 material="shader: chromakey; src: #vid; color: 0 1 0; opacity: 0.99" 
                 position="0 0 0">
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const ui = document.querySelector('#ui');
      const video = document.querySelector('#vid');

      ui.addEventListener('click', () => {
        ui.style.display = 'none'; 
        
        video.muted = true;
        video.play().then(() => {
          setTimeout(() => { video.muted = false; }, 100);
          console.log("再生成功だZ！");
        });
      });
    </script>
  </body>
</html>
